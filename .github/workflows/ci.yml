name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Vet
        run: make vet
      - name: Test with race detector
        run: make test-race
      - name: Test with coverage
        run: make test-cover
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  test-integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Start DB and run migrations
        run: make docker-up
      - name: Run integration tests
        run: make test-integration

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build native binaries
        run: make build
      - name: Verify Lambda bootstraps exist
        run: |
          test -f bin/lambda-fetch-tickers/bootstrap
          test -f bin/lambda-ingest-ohlcv/bootstrap
          test -f bin/lambda-fetch-technicals/bootstrap
          test -f bin/lambda-fetch-fundamentals/bootstrap
          test -f bin/lambda-enrich-ticker/bootstrap
          test -f bin/lambda-compute-stats/bootstrap

  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Post the coverage summary as a single PR comment, updated in place.
  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      # The repository tests are gated on DATABASE_URL, so without a database
      # internal/repository reports 0% despite being covered by the
      # integration suite. Start the DB so the figure reflects reality.
      - name: Start DB and run migrations
        run: make docker-up

      - name: Coverage for this PR
        run: make test-cover-integration

      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # Best effort: if the base fails to build, the report degrades to
      # absolute numbers with no deltas rather than failing the job.
      # Invoked directly rather than through make, so this still works when the
      # base branch predates the test-cover-integration target.
      - name: Coverage for the base branch
        continue-on-error: true
        working-directory: base
        env:
          DATABASE_URL: postgres://profitify:profitify@localhost:5432/profitify?sslmode=disable
        run: go test -count=1 -coverprofile=../base-coverage.out ./...

      - name: Render the report
        run: |
          if [ -f base-coverage.out ]; then
            python3 scripts/coverage-report.py coverage.out base-coverage.out > report.md
          else
            python3 scripts/coverage-report.py coverage.out > report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Dependabot and fork pull requests get a read-only token, so commenting
      # is not possible there. Never fail the job over it.
      - name: Comment on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
