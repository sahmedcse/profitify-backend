services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: profitify-db
    environment:
      POSTGRES_USER: profitify
      POSTGRES_PASSWORD: profitify
      POSTGRES_DB: profitify
    ports:
      - "5432:5432"
    volumes:
      - profitify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitify -d profitify"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: build/migrate.Dockerfile
    container_name: profitify-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command: ["-dir", "/migrations", "postgres", "postgres://profitify:profitify@db:5432/profitify?sslmode=disable", "up"]

  localstack:
    image: localstack/localstack:4.4
    container_name: profitify-localstack
    profiles: ["lambda"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,stepfunctions
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues"]
      interval: 3s
      timeout: 5s
      retries: 10

  lambda-fetch-tickers:
    build:
      context: .
      dockerfile: build/lambda-fetch-tickers.Dockerfile
    container_name: profitify-lambda-fetch-tickers
    profiles: ["lambda"]
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/profitify-tickers
      TICKER_LIMIT: "110"
      TICKER_ALLOWLIST: ${TICKER_ALLOWLIST:-}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      APP_ENV: development
    ports:
      - "9000:8080"

  lambda-fetch-technicals:
    build:
      context: .
      dockerfile: build/lambda-fetch-technicals.Dockerfile
    container_name: profitify-lambda-fetch-technicals
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      APP_ENV: development
    ports:
      - "9002:8080"

  lambda-ingest-ohlcv:
    build:
      context: .
      dockerfile: build/lambda-ingest-ohlcv.Dockerfile
    container_name: profitify-lambda-ingest-ohlcv
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      APP_ENV: development
    ports:
      - "9001:8080"

  lambda-enrich-ticker:
    build:
      context: .
      dockerfile: build/lambda-enrich-ticker.Dockerfile
    container_name: profitify-lambda-enrich-ticker
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      APP_ENV: development
    ports:
      - "9004:8080"

  lambda-fetch-fundamentals:
    build:
      context: .
      dockerfile: build/lambda-fetch-fundamentals.Dockerfile
    container_name: profitify-lambda-fetch-fundamentals
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      APP_ENV: development
    ports:
      - "9003:8080"

  lambda-compute-stats:
    build:
      context: .
      dockerfile: build/lambda-compute-stats.Dockerfile
    container_name: profitify-lambda-compute-stats
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      APP_ENV: development
    ports:
      - "9005:8080"

  lambda-start-pipeline:
    build:
      context: .
      dockerfile: build/lambda-start-pipeline.Dockerfile
    container_name: profitify-lambda-start-pipeline
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      SFN_ARN: arn:aws:states:us-east-1:000000000000:stateMachine:profitify-pipeline
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      APP_ENV: development
    ports:
      - "9006:8080"

  lambda-close-pipeline:
    build:
      context: .
      dockerfile: build/lambda-close-pipeline.Dockerfile
    container_name: profitify-lambda-close-pipeline
    profiles: ["lambda"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://profitify:profitify@db:5432/profitify?sslmode=disable
      APP_ENV: development
    ports:
      - "9007:8080"

volumes:
  profitify-db-data:
